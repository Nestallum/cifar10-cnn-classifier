data:
  dataset: "CIFAR-10"
  data_dir: "data/"
  num_classes: 10
  num_workers: 4

training:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0005
  warmup_epochs: 5 

model:
  name: "ResNet18"
  dropout: 0.5

seed: 42

logging:
  log_dir: "logs/"
  checkpoint_dir: "checkpoints/"
  save_every: 10  # save checkpoint every N epochs

evaluation:
  results_dir: "results/"